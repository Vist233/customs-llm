name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -timeout 5m ./...
      - run: go run ./cmd/tsctl validate

  binaries:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          case "$GITHUB_REF" in refs/tags/v*) v="${GITHUB_REF_NAME#v}" ;; *) v="dev-${GITHUB_SHA::7}" ;; esac
          mkdir dist
          for t in linux/amd64 linux/arm64 darwin/arm64 darwin/amd64; do
            os="${t%/*}"; arch="${t#*/}"; d="$(mktemp -d)"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=$v" -o "$d/customs" ./cmd/customs
            cp README.md "$d/"
            tar -C "$d" -czf "dist/customs-llm-$v-$os-$arch.tar.gz" customs README.md
          done
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -X main.version=$v" -o "dist/customs-llm-$v-windows-amd64.exe" ./cmd/customs
      - name: Smoke test the Linux binary
        run: |
          d="$(mktemp -d)"; tar -C "$d" -xzf dist/*-linux-amd64.tar.gz
          "$d/customs" version
          "$d/customs" testset validate
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*
          if-no-files-found: error

  dmg:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          case "$GITHUB_REF" in refs/tags/v*) v="${GITHUB_REF_NAME#v}" ;; *) v="dev-${GITHUB_SHA::7}" ;; esac
          packaging/macos/package.sh "$v" dist
      - name: Smoke test the dmg
        run: |
          hdiutil attach -nobrowse -mountpoint /tmp/customs-dmg dist/*.dmg
          /tmp/customs-dmg/customs-llm.app/Contents/Resources/customs version
          /tmp/customs-dmg/customs-llm.app/Contents/Resources/customs testset validate
          lipo -archs /tmp/customs-dmg/customs-llm.app/Contents/Resources/customs
          hdiutil detach /tmp/customs-dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: dist/*.dmg
          if-no-files-found: error

  windows-smoke:
    needs: binaries
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: Smoke test the exe
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist/*-windows-amd64.exe).FullName
          & $exe version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & $exe testset validate
          if ($LASTEXITCODE -ne 0) { exit 1 }

  # A tag produces a draft release: nothing is public until a person has tried the files and publishes it.
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [binaries, dmg, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS.txt)
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "customs-llm $GITHUB_REF_NAME" --notes-file "$notes"
